# Release gate for every push and pull request (docs/PHASE_1_CHECKLIST.md "Release evidence").
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual run (Actions › CI › Run workflow), e.g. after adding the test-server secrets

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talata
          POSTGRES_PASSWORD: talata
          POSTGRES_DB: talata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U talata -d talata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: talata
      DB_PASSWORD: talata
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: App key
        run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Build front end
        run: npm run build

      - name: Bundle budgets (docs/PERFORMANCE_BUDGET.md)
        run: npm run perf:bundle && npm run --silent perf:bundle -- --json > bundle-report.json

      - name: JS tests
        run: npm run test:js

      - name: PHP tests (PostgreSQL)
        run: php artisan test

      - name: PHP tests (SQLite — shared-hosting test server mode)
        run: touch database/testing.sqlite && vendor/bin/phpunit -c phpunit.sqlite.xml

      - name: Dependency audit
        run: composer audit --no-interaction && npm audit --omit=dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: bundle-report.json
          if-no-files-found: ignore

  # cPanel host (zarlio.ir): CI builds the release (vendor/ and public/build included, because cPanel has no
  # Composer/Node terminal) and publishes it to the `cpanel-release` branch. cPanel «Git Version Control» pulls
  # that branch and runs .cpanel.yml → scripts/deploy/cpanel-deploy.sh (docs/DEPLOYMENT.md §13).
  publish-cpanel-release:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/claude/friendly-hopper-ntt0vl'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write          # push the cpanel-release branch
    concurrency:
      group: cpanel-release
      cancel-in-progress: false
    env:
      # Optional: let CI trigger the cPanel deployment itself (cPanel › Security › Manage API Tokens).
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}       # e.g. 3114551444.cloudylink.com
      CPANEL_USER: ${{ secrets.CPANEL_USER }}       # cPanel account name
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CPANEL_REPO: ${{ secrets.CPANEL_REPO }}       # repository path on the server, e.g. /home/<user>/repositories/talata.ir
      SITE_URL: ${{ secrets.ZARLIO_SITE_URL }}      # e.g. https://zarlio.ir (for the version check)
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build release
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          npm ci && npm run build
          REL="$RUNNER_TEMP/rel"; mkdir -p "$REL"
          # .gitignore is left out on purpose: it would hide vendor/ and public/build from git.
          tar cf - --exclude=.git --exclude=./.github --exclude=./.gitignore --exclude=./node_modules --exclude=./tests --exclude=./docs \
            --exclude=./storage --exclude=./.env --exclude='./database/*.sqlite' . | tar xf - -C "$REL"
          SHORT="${GITHUB_SHA::12}"
          printf '%s' "$SHORT" > "$REL/REVISION"
          printf '%s' "$SHORT" > "$REL/public/release.txt"
          test -f "$REL/vendor/autoload.php" && test -f "$REL/public/build/manifest.json" && test -f "$REL/.cpanel.yml"
          du -sh "$REL" | cut -f1 | sed 's/^/release size: /'

      - name: Zip for manual upload
        run: |
          set -euo pipefail
          # Trim vendor test/doc folders to keep the download small.
          find "$RUNNER_TEMP/rel/vendor" -mindepth 3 -maxdepth 3 -type d \( -iname tests -o -iname test -o -iname docs -o -name .github -o -name examples \) -prune -exec rm -rf {} +
          (cd "$RUNNER_TEMP/rel" && zip -qr "$RUNNER_TEMP/zarlio-release.zip" .)
          ls -lh "$RUNNER_TEMP/zarlio-release.zip"

      - name: Upload the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarlio-release
          path: ${{ runner.temp }}/zarlio-release.zip
          compression-level: 0
          retention-days: 14

      - name: Publish to the cpanel-release branch
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::12}"; OUT="$RUNNER_TEMP/out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin cpanel-release > /dev/null 2>&1; then
            git fetch --depth=1 origin cpanel-release
            git worktree add -B cpanel-release "$OUT" FETCH_HEAD
          else
            echo "creating the cpanel-release branch"
            git worktree add --detach "$OUT"
            (cd "$OUT" && git checkout -q --orphan cpanel-release && git rm -rfq .)
          fi
          rsync -a --delete --exclude=/.git "$RUNNER_TEMP/rel/" "$OUT/"
          cd "$OUT"
          git add -A -f
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -q -m "Release $SHORT" -m "Built by CI from $GITHUB_SHA (vendor/ and public/build included). Generated: do not edit by hand."
          git push origin HEAD:refs/heads/cpanel-release
          echo "published $SHORT to cpanel-release"

      - name: Ask cPanel to deploy (optional)
        continue-on-error: true
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USER" ] || [ -z "$CPANEL_TOKEN" ] || [ -z "$CPANEL_REPO" ]; then
            echo "::notice::cPanel API secrets are not set: in cPanel › Git Version Control › Manage press «Update from Remote», then «Deploy HEAD Commit»."
            exit 0
          fi
          api() {  # api <module/function> -> JSON; the token is never printed
            curl -sS --max-time 180 -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" --get \
              --data-urlencode "repository_root=$CPANEL_REPO" --data-urlencode "branch=cpanel-release" \
              "https://$CPANEL_HOST:2083/execute/$1"
          }
          for fn in VersionControl/update VersionControlDeployment/create; do
            out="$(api "$fn" || true)"
            if [ "$(printf '%s' "$out" | jq -r '.status // 0' 2>/dev/null)" != "1" ]; then
              echo "::warning::cPanel $fn failed: $(printf '%s' "$out" | jq -c '.errors // .' 2>/dev/null | cut -c1-300). Press «Update from Remote» and «Deploy HEAD Commit» in cPanel."
              exit 1
            fi
            echo "cPanel $fn: ok"
          done

      - name: Check the live version (optional)
        continue-on-error: true
        run: |
          [ -n "$SITE_URL" ] && [ -n "$CPANEL_TOKEN" ] || { echo "version check skipped"; exit 0; }
          SHORT="${GITHUB_SHA::12}"
          for i in $(seq 1 12); do
            live="$(curl -fsS --max-time 20 "$SITE_URL/release.txt" 2>/dev/null || true)"
            [ "$live" = "$SHORT" ] && { echo "live version is $SHORT"; exit 0; }
            sleep 20
          done
          echo "::warning::$SITE_URL/release.txt still shows '${live:-nothing}', expected $SHORT (deployment may still be running, or press «Deploy HEAD Commit» in cPanel)."
          exit 1
