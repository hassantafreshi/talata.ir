# Release gate for every push and pull request (docs/PHASE_1_CHECKLIST.md "Release evidence").
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual run (Actions › CI › Run workflow), e.g. after adding the test-server secrets

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talata
          POSTGRES_PASSWORD: talata
          POSTGRES_DB: talata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U talata -d talata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: talata
      DB_PASSWORD: talata
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: App key
        run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Build front end
        run: npm run build

      - name: Bundle budgets (docs/PERFORMANCE_BUDGET.md)
        run: npm run perf:bundle && npm run --silent perf:bundle -- --json > bundle-report.json

      - name: JS tests
        run: npm run test:js

      - name: PHP tests (PostgreSQL)
        run: php artisan test

      - name: PHP tests (SQLite — shared-hosting test server mode)
        run: touch database/testing.sqlite && vendor/bin/phpunit -c phpunit.sqlite.xml

      - name: Dependency audit
        run: composer audit --no-interaction && npm audit --omit=dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: bundle-report.json
          if-no-files-found: ignore

  # Test server on Hostinger shared hosting (docs/DEPLOYMENT.md). Runs only after green tests, only for the
  # working branch, and only when the repository secrets below exist; otherwise it is skipped with a notice.
  # Secrets: HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER, HOSTINGER_SSH_PASSWORD, BRSAPI_KEY,
  # KAVENEGAR_API_KEY. Nothing secret is written to the repository or printed.
  deploy-test-server:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/claude/friendly-hopper-ntt0vl'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-test-server
      cancel-in-progress: false
    env:
      SITE: violet-leopard-846931.hostingersite.com
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
      KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
    steps:
      - name: Test server configured?
        id: cfg
        run: |
          # Names and shapes only — values are never printed.
          chk() { if [ -n "$2" ]; then echo "secret $1: set (${#2} chars)"; else echo "secret $1: MISSING"; fi; }
          chk HOSTINGER_SSH_HOST "$SSH_HOST"; chk HOSTINGER_SSH_PORT "$SSH_PORT"; chk HOSTINGER_SSH_USER "$SSH_USER"
          chk HOSTINGER_SSH_PASSWORD "$SSHPASS"; chk BRSAPI_KEY "$BRSAPI_KEY"; chk KAVENEGAR_API_KEY "$KAVENEGAR_API_KEY"
          [ -n "$SSH_HOST" ] && ! printf '%s' "$SSH_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' && echo "::warning::HOSTINGER_SSH_HOST has spaces or odd characters (expected 185.212.71.141)"
          [ -n "$SSH_PORT" ] && ! printf '%s' "$SSH_PORT" | grep -Eq '^[0-9]{2,5}$' && echo "::warning::HOSTINGER_SSH_PORT must be digits only (expected 65002)"
          [ -n "$SSH_USER" ] && ! printf '%s' "$SSH_USER" | grep -Eq '^[a-z0-9_]+$' && echo "::warning::HOSTINGER_SSH_USER has spaces or odd characters (expected u912604790)"
          [ -n "$SSHPASS" ] && [ "$SSHPASS" != "$(printf '%s' "$SSHPASS" | xargs -0)" ] && echo "::warning::HOSTINGER_SSH_PASSWORD starts or ends with a space/newline — paste it again"
          if [ -z "$SSH_HOST" ] || [ -z "$SSHPASS" ] || [ -z "$SSH_USER" ]; then
            echo "::notice::Hostinger secrets are not set; test-server deploy skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.go == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.cfg.outputs.go == 'true'
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.go == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build release
        if: steps.cfg.outputs.go == 'true'
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          npm ci && npm run build
          tar czf "$RUNNER_TEMP/release.tgz" --exclude=./.git --exclude=./node_modules --exclude=./tests --exclude=./docs \
            --exclude=./storage --exclude=./.env --exclude=./database/testing.sqlite .

      - name: Upload and switch release
        if: steps.cfg.outputs.go == 'true'
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          umask 077
          {
            [ -n "$BRSAPI_KEY" ] && echo "BRSAPI_KEY=$BRSAPI_KEY"
            [ -n "$KAVENEGAR_API_KEY" ] && echo "KAVENEGAR_API_KEY=$KAVENEGAR_API_KEY"
            echo "KAVENEGAR_SENDER=10007770000707"
            echo "TEST_ADMIN_MOBILE=09396727215"
            echo "APP_URL=https://$SITE"
          } > "$RUNNER_TEMP/secrets.env"
          DIR="domains/$SITE"
          OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          sshpass -e scp $OPTS -P "${SSH_PORT:-22}" "$RUNNER_TEMP/release.tgz" scripts/deploy/hostinger-test.sh "$RUNNER_TEMP/secrets.env" "$SSH_USER@$SSH_HOST:$DIR/"
          sshpass -e ssh $OPTS -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "bash \"$DIR/hostinger-test.sh\" \"$DIR\" \"\$HOME/$DIR/release.tgz\" \"${GITHUB_SHA::12}\" \"\$HOME/$DIR/secrets.env\"; rm -f \"$DIR/hostinger-test.sh\""
          rm -f "$RUNNER_TEMP/secrets.env"

      - name: Smoke test
        if: steps.cfg.outputs.go == 'true'
        run: |
          for path in / /login /terms /mazneh; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE$path")
            echo "$path $code"
          done
          curl -fsS "https://$SITE/" | grep -q 'زرلیو'
