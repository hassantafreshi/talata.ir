<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">

<title>اتصال برقرار نیست · زرلیو</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Static on purpose: no session, no personal data, no hashed asset to go stale. */
  @font-face { font-family: Vazirmatn; font-weight: 100 900; font-display: swap; src: url(/fonts/Vazirmatn-arabic-subset.woff2) format("woff2"); }
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ee; color: #17191c; font: 17px/1.8 Vazirmatn, Tahoma, sans-serif; }
  main { max-width: 26rem; padding: 24px 16px; text-align: center; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 1.3rem; margin: 12px 0 4px; }
  p { margin: 0 0 12px; color: #4a4f57; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #121417; color: #e0b44c; font-weight: 700; text-decoration: none; }
  .btn:focus-visible { outline: 3px solid #c99a3a; outline-offset: 3px; }
  @media (prefers-color-scheme: dark) { body { background: #121417; color: #f2efe8; } p { color: #b9b4aa; } .btn { background: #e0b44c; color: #121417; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="27" fill="#121417"/><g transform="translate(60 60) scale(.8) translate(-60 -55)"><polygon points="34,20 86,20 94,40 26,40" fill="#E0B44C"/><polygon points="70,44 94,44 50,76 26,76" fill="#C99A3A"/><polygon points="34,80 86,80 94,100 26,100" fill="#E0B44C"/></g></svg>
  <h1>اینترنت در دسترس نیست</h1>
  <p>زرلیو برای باز کردن این صفحه به اینترنت نیاز دارد. فاکتورهای صادرشده و پیش‌نویس‌های ذخیره‌شده سر جایشان هستند.</p>
  <p>پس از وصل شدن اینترنت، «تلاش دوباره» را بزنید.</p>
  <a class="btn" href="">تلاش دوباره</a>
</main>
</body>
</html>
